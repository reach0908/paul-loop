name: runtime packaging

on:
  workflow_call:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: verify adapters, resolver, executable modes and setup isolation (no model calls)
        run: node --test tools/loop-engine/test/plugin-path.test.mjs tools/loop-engine/test/apply-patch-runtime.test.mjs tools/loop-engine/test/runtime-packages.test.mjs
      - name: verify project updates, local installation and native evaluation accounting (no model calls)
        run: node --test scripts/project-plugin.test.mjs scripts/install-codex.test.mjs scripts/native-eval/native.test.mjs
      - name: verify skill lock and generate both runtime packages
        run: |
          node scripts/refresh-skill-lock.mjs --check
          node scripts/generate-runtime-packages.mjs
          node scripts/generate-runtime-packages.mjs --check
      - name: upload reviewable packages and provenance (not a marketplace install)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-packages
          path: build/runtime-packages
          include-hidden-files: true
          retention-days: 14
  claude-schema:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Preserve the existing check name. Moving compatibility runs separately, weekly.
        claude: ['2.1.261']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: |
          npm ci --prefix .github/claude-code --ignore-scripts --no-audit --no-fund
          npm audit signatures --prefix .github/claude-code
          node .github/claude-code/node_modules/@anthropic-ai/claude-code/install.cjs
          export PATH="$PWD/.github/claude-code/node_modules/.bin:$PATH"
          node scripts/generate-runtime-packages.mjs
          claude plugin validate --strict build/runtime-packages/claude
          for plugin in build/runtime-packages/claude/plugins/*; do
            claude plugin validate --strict "$plugin"
          done
