name: Claude compatibility canary

# Advisory compatibility signal; never a release dependency or an artifact publisher.
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-compatibility
  cancel-in-progress: true

jobs:
  latest-schema:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@latest
      - run: |
          node scripts/generate-runtime-packages.mjs
          claude plugin validate --strict build/runtime-packages/claude
          for plugin in build/runtime-packages/claude/plugins/*; do
            claude plugin validate --strict "$plugin"
          done
