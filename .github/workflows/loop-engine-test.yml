name: loop-engine test

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Explicit types (default is opened/synchronize/reopened only): also re-run on `edited` so a
    # PR base-branch retarget triggers a fresh run instead of leaving a stale green check from the
    # old base in place. Tradeoff: `edited` also fires on title/body/label edits with no code
    # change — an acceptable cost for closing the base-retarget staleness gap.
    types: [opened, synchronize, reopened, edited]

# 이 워크플로는 GITHUB_TOKEN을 전혀 쓰지 않는다 — 레포 기본값 상속 대신 명시적 최소권한.
permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are a test input, not decoration: publish-freshness.test.sh compares each plugin's
          # subtree against its own `<plugin>--v<version>` tag. Without them it fails closed (by
          # design — silently passing is the failure it exists to end), so the default tagless
          # checkout would turn that gate red on every run.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: reject mutable workflow action references
        run: node --test scripts/workflow-actions.test.mjs
      - name: run loop-engine self-test suite
        run: bash tools/loop-engine/test/run.sh
      - name: validate plugin + marketplace manifests
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.261
          claude plugin validate --strict .
          claude plugin validate --strict tools/loop-engine
          claude plugin validate --strict tools/ship-flow

  verifier-pinned-review:
    # base가 있어야 성립하는 pinned-baseline 체크 — pull_request 이벤트에서만 의미가 있다
    # (issue #14, ADR-0002).
    if: "${{ github.event_name == 'pull_request' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: run verifier-pinned-review against the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash tools/loop-engine/bin/verifier-pinned-review.sh --base "$BASE_SHA"
